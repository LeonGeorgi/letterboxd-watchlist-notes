<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="1280" height="800" fill="#14181c"/>
  <image href="raw-perfect-blue.png" x="0" y="80" width="1280" height="720"/>

  <rect width="1280" height="80" fill="#202830"/>
  <rect x="0" y="0" width="8" height="80" fill="#40bcf4"/>
  <circle cx="49" cy="40" r="10" fill="#ff8000"/>
  <circle cx="69" cy="40" r="10" fill="#00e054"/>
  <circle cx="89" cy="40" r="10" fill="#40bcf4"/>
  <text x="120" y="35" fill="#ffffff" font-family="Arial" font-size="24" font-weight="700">YOUR NOTE, RIGHT WHERE YOU NEED IT</text>
  <text x="120" y="59" fill="#9ab" font-family="Arial" font-size="15">View it instantly, then edit without leaving the film page.</text>

  <g font-family="Arial">
    <rect x="884" y="203" width="231" height="444" rx="5" fill="#456"/>

    <g text-anchor="middle">
      <ellipse cx="922" cy="232" rx="20" ry="13" fill="#00e054"/>
      <circle cx="922" cy="232" r="7" fill="#456"/>
      <text x="922" y="274" fill="#cde" font-size="13">Logged</text>

      <path d="M975 224 C975 211 997 211 997 225 C997 211 1019 211 1019 224 C1019 239 997 252 997 252 C997 252 975 239 975 224Z" fill="none" stroke="#9ab" stroke-width="3"/>
      <text x="997" y="274" fill="#cde" font-size="13">Like</text>

      <circle cx="1075" cy="231" r="22" fill="#40bcf4"/>
      <path d="M1063 231 L1072 238 L1088 220" fill="none" stroke="#345" stroke-width="3"/>
      <text x="1075" y="274" fill="#cde" font-size="13">Watchlist</text>
    </g>

    <line x1="884" y1="291" x2="1115" y2="291" stroke="#293848"/>
    <text x="999.5" y="313" fill="#cde" font-size="12" text-anchor="middle">Rated</text>
    <text x="999.5" y="349" fill="#00e054" font-size="28" text-anchor="middle" letter-spacing="2">★★★</text>
    <text x="1076" y="349" fill="#314052" font-size="28" text-anchor="middle" letter-spacing="2">★★</text>

    <line x1="884" y1="365" x2="1115" y2="365" stroke="#293848"/>
    <text x="999.5" y="391" fill="#cde" font-size="13" text-anchor="middle">Show your activity</text>
    <line x1="884" y1="407" x2="1115" y2="407" stroke="#293848"/>
    <text x="999.5" y="433" fill="#cde" font-size="13" text-anchor="middle">Log again/add review…</text>
    <line x1="884" y1="449" x2="1115" y2="449" stroke="#293848"/>
    <text x="999.5" y="475" fill="#cde" font-size="13" text-anchor="middle">Add to lists…</text>
    <line x1="884" y1="491" x2="1115" y2="491" stroke="#293848"/>

    <rect x="896" y="503" width="207" height="98" rx="3" fill="#2c3440"/>
    <rect x="896" y="503" width="4" height="98" rx="2" fill="#ff8000"/>
    <text x="910" y="523" fill="#ff9d3d" font-size="11" font-weight="700" letter-spacing="0.8">MY NOTE</text>
    <text x="1089" y="523" fill="#89a" font-size="11" text-anchor="end">List entry</text>
    <text x="910" y="549" fill="#dceeff" font-size="14">
      <tspan x="910" dy="0">Festival recommendation</tspan>
      <tspan x="910" dy="19">Watch after Paprika.</tspan>
    </text>
    <text x="1088" y="586" fill="#00e054" font-size="12" font-weight="700" text-anchor="end">EDIT</text>

    <line x1="884" y1="613" x2="1115" y2="613" stroke="#293848"/>
    <text x="999.5" y="640" fill="#cde" font-size="13" text-anchor="middle">Share</text>
